<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>상품 관리 · SYNAP365</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-logo">SYNAP365 <span>관리자</span></div>
      <div class="admin-header-actions">
        <a href="/" target="_blank" class="btn btn-ghost">사이트 보기</a>
        <button id="logoutBtn" class="btn btn-ghost">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <section class="panel" id="formPanel">
      <div class="panel-head">
        <h2 id="formTitle">새 상품 등록</h2>
        <button type="button" id="cancelEditBtn" class="btn btn-text" hidden>수정 취소</button>
      </div>
      <form id="productForm" class="product-form">
        <div class="form-row">
          <div class="field">
            <label for="f-name">등록상품명 *</label>
            <input type="text" id="f-name" name="name" required maxlength="80" placeholder="예: DualCam 듀얼 대시캠 앱 (내부 관리용)">
            <p class="hint">관리자 화면에서만 보이는 이름입니다.</p>
          </div>
          <div class="field">
            <label for="f-displayName">노출상품명</label>
            <input type="text" id="f-displayName" name="displayName" maxlength="80" placeholder="비워두면 등록상품명과 동일하게 표시">
            <p class="hint">고객에게 실제로 보여지는 이름입니다.</p>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="f-cat">카테고리 *</label>
            <select id="f-cat" name="cat" required>
              <option value="remotecam">원격카메라</option>
              <option value="electronics">전자기기</option>
              <option value="home">스마트홈</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="f-desc">상세 설명 *</label>
          <textarea id="f-desc" name="desc" required rows="4" maxlength="1000" placeholder="상품 상세 페이지에 노출될 설명을 입력하세요."></textarea>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="f-price">판매가 (원) *</label>
            <input type="number" id="f-price" name="price" required min="0" step="100" placeholder="39000">
          </div>
          <div class="field">
            <label for="f-originalPrice">정가 (원, 선택)</label>
            <input type="number" id="f-originalPrice" name="originalPrice" min="0" step="100" placeholder="할인 전 가격">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="f-badge">배지</label>
            <select id="f-badge" name="badge">
              <option value="none">없음</option>
              <option value="BEST">BEST</option>
              <option value="NEW">NEW</option>
              <option value="SALE">SALE</option>
            </select>
          </div>
          <div class="field">
            <label for="f-rating">평점 (0~5)</label>
            <input type="number" id="f-rating" name="rating" min="0" max="5" step="0.1" placeholder="5.0">
          </div>
          <div class="field">
            <label for="f-reviews">리뷰 수</label>
            <input type="number" id="f-reviews" name="reviews" min="0" step="1" placeholder="0">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="f-image">상품 이미지</label>
            <input type="file" id="f-image" name="image" accept="image/*">
            <p class="hint">업로드하지 않으면 아래 아이콘 이모지가 대신 표시됩니다.</p>
          </div>
          <div class="field">
            <label for="f-icon">아이콘 이모지 (이미지 없을 때)</label>
            <input type="text" id="f-icon" name="icon" maxlength="4" placeholder="예: 📷">
          </div>
        </div>

        <img id="imgPreview" class="img-preview" hidden alt="현재 이미지">

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">상품 등록</button>
        </div>
        <p class="form-error" id="formError"></p>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>등록된 상품 (<span id="productCount">0</span>)</h2>
      </div>
      <div class="table-wrap">
        <table class="product-table">
          <thead>
            <tr>
              <th>이미지</th>
              <th>상품명</th>
              <th>카테고리</th>
              <th>가격</th>
              <th>배지</th>
              <th>평점</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
        <p class="empty-msg" id="emptyMsg" hidden>등록된 상품이 없습니다.</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
